[project]
name = "sam3-ls-backend"
version = "0.1.0"
description = "Label Studio ML backend serving SAM3 (point/box prompts) on Apple MPS"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.14.1",
  "torchvision",
  "transformers==5.20.2",
  "label-studio-ml==1.0.9",
  "opencv-python-headless",
  "numpy",
  "pillow",
  "gunicorn",
  "python-dotenv",
  "requests",
  "rq>=2.12.0",
  "label-studio-converter>=0.0.59",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "playwright>=1.64.0",
]
